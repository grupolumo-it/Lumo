<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login | Lumo Ecosystem</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="./tailwind-theme.js"></script>
    <link href="./shared-styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-gutter login-page">
    <!-- Main Container: Split Layout on Desktop -->
    <main element-is="login-card"
        class="w-full max-w-container-max min-h-[800px] flex flex-col md:flex-row bg-transparent md:bg-surface-container-lowest rounded-lg overflow-hidden md:ambient-shadow">
        <!-- Left Side: Login Form Canvas -->
        <section element-is="login-form-area"
            class="flex-1 flex flex-col p-lg md:p-xl justify-center items-center md:items-start glass-effect md:bg-transparent rounded-lg md:rounded-none">
            <!-- Brand Logo -->
            <div element-is="brand-logo-container" class="mb-lg w-full flex justify-center md:justify-start">
                <span class="font-headline-md text-4xl font-bold text-primary">Lumo</span>
            </div>
            <!-- Header Text -->
            <div element-is="login-header" class="mb-lg text-center md:text-left">
                <h1 class="font-display-lg text-display-lg text-primary mb-xs">Welcome back</h1>
                <p class="font-body-md text-body-md text-on-surface-variant">Sign in to Lumo to manage your professional
                    marketplace.</p>
            </div>
            <!-- Form -->
            <form element-is="login-form" class="space-y-md w-full max-w-[480px]" onsubmit="event.preventDefault();">
                <div element-is="form-field" class="flex flex-col space-y-xs">
                    <label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="email">Email or
                        Username</label>
                    <input
                        class="w-full h-[56px] px-md rounded-full border border-outline focus:border-primary focus:ring-2 focus:ring-primary/10 outline-none transition-all bg-surface-container-lowest font-body-md text-body-md text-on-surface"
                        id="email" placeholder="name@company.com" type="text" />
                </div>
                <div element-is="form-field" class="flex flex-col space-y-xs">
                    <div class="flex justify-between items-center px-xs">
                        <label class="font-label-md text-label-md text-on-surface-variant"
                            for="password">Password</label>
                        <a element-is="forgot-password-link" class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors"
                            href="#">Forgot Password?</a>
                    </div>
                    <div class="relative">
                        <input
                            class="w-full h-[56px] pl-md pr-14 rounded-full border border-outline focus:border-primary focus:ring-2 focus:ring-primary/10 outline-none transition-all bg-surface-container-lowest font-body-md text-body-md text-on-surface"
                            id="password" placeholder="••••••••" type="password" />
                        <button element-is="toggle-password-btn"
                            class="absolute right-md top-1/2 -translate-y-1/2 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors"
                            type="button">
                            <span element-is="password-visibility-icon" class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>
                <div element-is="form-field" class="flex items-center space-x-sm pt-xs">
                    <input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary cursor-pointer"
                        id="remember" type="checkbox" />
                    <label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember">Keep
                        me signed in</label>
                </div>
                <button element-is="login-button"
                    class="w-full h-[56px] bg-primary text-on-primary rounded-full font-label-md text-label-md hover:bg-primary-container active:scale-[0.98] transition-all ambient-shadow mt-md">
                    Sign In
                </button>
            </form>
            <!-- Footer Section -->
            <div element-is="login-footer-options" class="mt-xl pt-lg border-t border-outline-variant/30 w-full max-w-[480px]">
                <p class="font-body-sm text-body-sm text-on-surface-variant mb-sm text-center md:text-left">Don't have an account?</p>
                <div class="flex flex-col sm:flex-row gap-sm">
                    <button element-is="register-button"
                        class="flex-1 min-h-[48px] border border-outline text-primary rounded-full font-label-md text-label-md hover:bg-surface-container-high transition-colors">
                        Create account
                    </button>
                    <button element-is="lbo-onboarding-button"
                        class="flex-1 min-h-[48px] bg-secondary-container text-on-secondary-container rounded-full font-label-md text-label-md hover:bg-secondary-fixed transition-colors">
                        Join as LBO
                    </button>
                </div>
            </div>
        </section>
        <!-- Right Side: Lifestyle Visual / Hero -->
        <section element-is="login-hero-area" class="hidden md:flex flex-1 relative overflow-hidden login-gradient">
            <div class="absolute inset-0 opacity-80">
                <img class="w-full h-full object-cover"
                    data-alt="A clean and expansive professional office environment with floor-to-ceiling windows overlooking a sunset cityscape. The interior features minimalist furniture in slate blue and white tones, reflecting a high-end corporate marketplace aesthetic. Soft ambient lighting creates a warm and inviting atmosphere, symbolizing professional success and reliable business operations. The overall composition is sophisticated, spacious, and perfectly aligned with a premium modern design system."
                    src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=1920" />
            </div>
            <!-- Overlay Content -->
            <div
                class="relative z-10 w-full h-full flex flex-col items-center justify-end p-xl bg-gradient-to-t from-primary/80 to-transparent">
                <div element-is="hero-testimonial-card" class="glass-effect p-lg rounded-lg max-w-[400px] border border-white/20">
                    <div element-is="hero-badge" class="flex items-center space-x-sm mb-sm text-primary">
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">stars</span>
                        <span class="font-label-md text-label-md">Trusted Ecosystem</span>
                    </div>
                    <p class="font-headline-sm text-headline-sm text-primary mb-sm">Building the future of digital
                        commerce, together.</p>
                    <p class="font-body-sm text-body-sm text-on-secondary-container">Join over 50,000 professional
                        entrepreneurs growing their business with Lumo's intuitive toolset.</p>
                </div>
            </div>
            <!-- Animated Decorative Elements -->
            <div
                class="absolute top-10 right-10 w-32 h-32 bg-secondary-container/20 rounded-full blur-3xl animate-pulse">
            </div>
            <div class="absolute bottom-1/2 left-20 w-48 h-48 bg-primary-container/30 rounded-full blur-3xl animate-bounce"
                style="animation-duration: 8s;"></div>
        </section>
    </main>
</body>

</html>
